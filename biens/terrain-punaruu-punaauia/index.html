  <style>
    body{margin:0;background:#071d1e;color:#fff;font-family:"DM Sans",sans-serif}.private-lock{min-height:100svh;display:grid;place-items:center;padding:28px}.private-lock-card{width:min(520px,100%);padding:34px;border:1px solid rgba(255,255,255,.14);border-radius:28px;background:#0b2728;box-shadow:0 35px 90px rgba(0,0,0,.35)}.private-lock-card h1{margin:10px 0 14px;color:#fff;font:500 clamp(42px,8vw,66px)/.95 "Cormorant Garamond",serif}.private-lock-card p{color:rgba(255,255,255,.62);line-height:1.6}.private-lock-card label{display:block;margin:24px 0 7px;font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.private-lock-card input{width:100%;min-height:52px;padding:0 16px;border:1px solid rgba(255,255,255,.2);border-radius:12px;background:#fff;color:#142127;font:inherit}.private-lock-card button{width:100%;min-height:52px;margin-top:12px;border:0;border-radius:999px;background:#c9ff72;color:#0b2728;font-weight:900;cursor:pointer}.private-lock-card small{display:block;margin-top:14px;color:rgba(255,255,255,.38);line-height:1.5}.private-lock-error{min-height:22px;margin:12px 0 0!important;color:#ffae9c!important;font-weight:700}.private-lock[hidden]{display:none}
  </style>

<body>
  <main class="private-lock" data-private-lock>
    <form class="private-lock-card" data-private-form>
      <p class="pn-kicker">Accès confidentiel</p>
