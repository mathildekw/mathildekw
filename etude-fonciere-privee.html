<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Étude foncière privée | Pacific Keys</title><link rel="stylesheet" href="/foncier-promotion.css?v=3"><link rel="stylesheet" href="/foncier-premium.css?v=1"></head><body class="fp hz-project-page"><main class="fp-wrap hz-cover" data-private><p class="fp-kicker">Lien privé et temporaire</p><h1>Chargement de l’étude…</h1><p>Ce contenu n’est pas indexé et nécessite un partage actif côté serveur.</p></main><script src="/site-config.js"></script><script>(async()=>{const root=document.querySelector('[data-private]'),token=location.hash.replace('#token=','');history.replaceState(null,'',location.pathname);if(!token){root.innerHTML='<h1>Lien privé invalide</h1>';return}try{const r=await fetch(MK_SITE_CONFIG.foncier.studiesApiUrl+'/shared/'+encodeURIComponent(token)),j=await r.json();if(!r.ok)throw 0;root.innerHTML='<p class="fp-kicker">Étude privée · partage temporaire</p><h1>'+String(j.title).replace(/[<>]/g,'')+'</h1><div class="hz-cover-meta"><span>'+String(j.location_label||'Localisation confidentielle').replace(/[<>]/g,'')+'</span><span>'+(j.surface||'—')+' m²</span></div><section class="fp-section"><h2>Présentation</h2><p>'+String(j.introduction||'').replace(/[<>]/g,'')+'</p><p class="hz-disclaimer">Ce dossier reste privé. Toute diffusion nécessite l’accord de Pacific Keys Properties.</p></section>'}catch(e){root.innerHTML='<h1>Partage expiré ou révoqué</h1><p>Demande un nouveau lien à Mathilde.</p>'}})()</script></body></html>
