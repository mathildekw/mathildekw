<!doctype html>
<html lang="fr-PF">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Signer le bon de visite | Mathilde KW</title>
  <link rel="stylesheet" href="/styles.css?v=20261025">
  <link rel="stylesheet" href="/terrain-professionnel-punaauia.css?v=6">
</head>
<body>
  <header class="topbar"><nav class="nav wrap" aria-label="Navigation principale"><a class="brand text-brand" href="/"><span><strong>Mathilde KW</strong><span>Conseillère immobilière</span></span></a></nav></header>
  <main class="pro-section">
    <div class="wrap">
      <section class="pro-form-card" aria-labelledby="signature-title">
        <p class="eyebrow">Validation sécurisée</p>
        <h1 id="signature-title">Bon de présentation et de visite</h1>
        <div data-signature-status role="status">Vérification du lien reçu par email…</div>
        <div data-signature-content hidden>
          <p><strong>Bien :</strong> <span data-property-label></span></p>
          <p><strong>Référence :</strong> <span data-property-reference></span></p>
          <div data-clauses></div>
          <form data-signature-form>
            <div class="field"><label for="signer-name">Ton nom complet</label><input id="signer-name" name="signerName" autocomplete="name" required></div>
            <label><input type="checkbox" name="consent" required> <span data-consent-text></span></label>
            <button class="btn primary" type="submit">Signer et confirmer le bon de visite</button>
          </form>
        </div>
      </section>
    </div>
  </main>
  <script src="/site-config.js?v=10" defer></script>
  <script src="/signature-bon-visite.js?v=1" defer></script>
</body>
</html>
