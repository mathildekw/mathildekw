name: Calendrier éditorial Facebook et Instagram

on:
  schedule:
    - cron: "15 18 * * 2,5" # 08:15 à Tahiti (UTC-10), mardi et vendredi
  workflow_dispatch:
    inputs:
      date:
        description: "Date tahitienne à tester ou publier (AAAA-MM-JJ)"
        required: false
        type: string
      dry_run:
        description: "Tester sans publier"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: social-calendar
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le calendrier validé
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Vérifier les publications
        run: python3 social/check_posts.py
      - name: Publier les contenus prévus
        env:
          SOCIAL_DATE: ${{ inputs.date }}
          META_GRAPH_API_VERSION: ${{ secrets.META_GRAPH_API_VERSION }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          SITE_ORIGIN: https://mathildekw.com
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/publish-social-calendar.mjs --dry-run
          else
            node scripts/publish-social-calendar.mjs
          fi
      - name: Mémoriser les publications envoyées
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        run: |
          if git diff --quiet -- social/published.json; then exit 0; fi
          git config user.name "Mathilde KW Social Calendar"
          git config user.email "actions@users.noreply.github.com"
          git add social/published.json
          git commit -m "chore(social): mémoriser les publications envoyées"
          git push
