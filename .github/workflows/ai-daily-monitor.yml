name: AI Team - Surveillance quotidienne

on:
  schedule:
    - cron: "20 16 * * *" # 06:20 à Tahiti (UTC-10)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-daily-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Récupérer le code approuvé
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Exécuter les contrôles déterministes
        id: audit
        continue-on-error: true
        run: node scripts/ai-team/run-audit.mjs --cadence=daily
      - name: Conserver le rapport vérifiable
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-daily-report-${{ github.run_id }}
          path: ai-reports/
          retention-days: 30
          if-no-files-found: error
      - name: Signaler les contrôles en échec
        if: steps.audit.outcome == 'failure'
        run: exit 1
