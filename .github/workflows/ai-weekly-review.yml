name: AI Team - Bilan hebdomadaire contrôlé

on:
  schedule:
    - cron: "0 17 * * 1" # Lundi 07:00 à Tahiti (UTC-10)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-weekly-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code approuvé
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Générer le bilan factuel
        id: audit
        continue-on-error: true
        run: node scripts/ai-team/run-audit.mjs --cadence=weekly
      - name: Conserver le rapport complet
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-weekly-report-${{ github.run_id }}
          path: ai-reports/
          retention-days: 90
          if-no-files-found: error
      - name: Créer une proposition sans fusion automatique
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="ai-team/report-${GITHUB_RUN_ID}"
          git config user.name "Pacific Keys AI Team"
          git config user.email "actions@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add ai-reports/latest.json ai-reports/weekly.md
          git commit -m "report: bilan IA hebdomadaire"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "Bilan IA hebdomadaire — revue requise" --body-file ai-reports/weekly.md
      - name: Signaler les contrôles en échec
        if: steps.audit.outcome == 'failure'
        run: exit 1
