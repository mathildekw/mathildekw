name: Codex - Valider une mission

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: codex-mission-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.label.name == 'ai:ready'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Vérifier le contrat de mission sans exécuter son contenu
        id: contract
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          missing=""
          for heading in "### Objectif" "### Preuves et contexte" "### Périmètre autorisé" "### Interdictions" "### Critères d'acceptation" "### Tests attendus"; do
            if ! printf '%s' "$ISSUE_BODY" | grep -Fq "$heading"; then
              missing="${missing}${heading}\n"
            fi
          done
          if [ -n "$missing" ]; then
            printf 'valid=false\n' >> "$GITHUB_OUTPUT"
            printf 'missing<<EOF\n%bEOF\n' "$missing" >> "$GITHUB_OUTPUT"
          else
            printf 'valid=true\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Publier l'état de la file de missions
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          VALID: ${{ steps.contract.outputs.valid }}
          MISSING: ${{ steps.contract.outputs.missing }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$VALID" = "true" ]; then
            body="✅ Mission structurée et placée dans la file \`ai:ready\`. Aucun code ni contenu du ticket n'a été exécuté. Une connexion Codex autorisée peut maintenant la prendre en charge sur une branche dédiée. Suivi : ${RUN_URL}"
          else
            body="⛔ Mission incomplète. Complète les sections suivantes avant prise en charge :\n\n${MISSING}\nSuivi : ${RUN_URL}"
          fi
          jq -n --arg body "$body" '{body:$body}' > comment.json
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            --data-binary @comment.json > /dev/null

      - name: Refuser une mission incomplète
        if: steps.contract.outputs.valid != 'true'
        run: exit 1
